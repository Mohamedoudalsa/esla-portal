    // Main App Component
    function App() {
      const [lang, setLang] = useState('ar');
      const curT = t[lang];

      // Auth state
      const [token, setToken] = useState(localStorage.getItem('esla_token') || null);
      const [user, setUser] = useState(null);
      const [activeTab, setActiveTab] = useState('status'); // 'tiers' | 'upload' | 'status' | 'admin'
      const [authModal, setAuthModal] = useState({ open: false, mode: 'login' }); // 'login' | 'register'

      // Form state for auth
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [registerForm, setRegisterForm] = useState({
        full_name_ar: '',
        full_name_en: '',
        email: '',
        phone_whatsapp: '+20',
        password: ''
      });
      const [authError, setAuthError] = useState('');
      const [authLoading, setAuthLoading] = useState(false);

      // Data state
      const [tiers, setTiers] = useState([]);
      const [application, setApplication] = useState(null);
      const [uploadingDocType, setUploadingDocType] = useState(null);
      const [uploadError, setUploadError] = useState('');

      // Admin state
      const [adminApps, setAdminApps] = useState([]);
      const [adminStats, setAdminStats] = useState(null);
      const [adminSearch, setAdminSearch] = useState('');
      const [adminCategoryFilter, setAdminCategoryFilter] = useState('all');
      const [adminStatusFilter, setAdminStatusFilter] = useState('all');
      const [selectedApp, setSelectedApp] = useState(null);
      const [adminDecision, setAdminDecision] = useState({ status: '', notes: '' });
      const [previewModalUrl, setPreviewModalUrl] = useState(null);

      // Update HTML lang and dir attribute
      useEffect(() => {
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      }, [lang]);

      // Fetch user profile if token exists
      useEffect(() => {
        if (token) {
          fetchUser();
        } else {
          setUser(null);
          setApplication(null);
        }
      }, [token]);

      // Load tiers on mount
      useEffect(() => {
        fetch('/api/tiers')
          .then(res => res.json())
          .then(data => setTiers(data))
          .catch(err => console.error("Error loading tiers:", err));
      }, []);

      // If user logged in, fetch application or admin data
      useEffect(() => {
        if (user) {
          if (user.role === 'admin') {
            fetchAdminData();
            setActiveTab('admin');
          } else {
            fetchMyApplication();
          }
        }
      }, [user]);

      const fetchUser = async () => {
        try {
          const res = await fetch('/api/auth/me', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            setUser(data);
          } else {
            handleLogout();
          }
        } catch (e) {
          console.error(e);
        }
      };

      const fetchMyApplication = async () => {
        try {
          const res = await fetch('/api/applications/my', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            setApplication(data);
            if (!data) {
              setActiveTab('tiers');
            } else if (data.documents.length === 0) {
              setActiveTab('upload');
            } else {
              setActiveTab('status');
            }
          }
        } catch (e) {
          console.error(e);
        }
      };

      const fetchAdminData = async () => {
        try {
          const [appsRes, statsRes] = await Promise.all([
            fetch(`/api/admin/applications?q=${encodeURIComponent(adminSearch)}&category=${adminCategoryFilter}&status=${adminStatusFilter}`, {
              headers: { 'Authorization': `Bearer ${token}` }
            }),
            fetch('/api/admin/stats', {
              headers: { 'Authorization': `Bearer ${token}` }
            })
          ]);
          if (appsRes.ok) {
            const appsData = await appsRes.json();
            setAdminApps(appsData);
          }
          if (statsRes.ok) {
            const statsData = await statsRes.json();
            setAdminStats(statsData);
          }
        } catch (e) {
          console.error(e);
        }
      };

      useEffect(() => {
        if (user && user.role === 'admin' && activeTab === 'admin') {
          fetchAdminData();
        }
      }, [adminSearch, adminCategoryFilter, adminStatusFilter, activeTab]);

      const handleLogin = async (e) => {
        if (e) e.preventDefault();
        setAuthLoading(true);
        setAuthError('');
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: loginEmail, password: loginPassword })
          });
          const data = await res.json();
          if (res.ok) {
            localStorage.setItem('esla_token', data.access_token);
            setToken(data.access_token);
            setUser(data.user);
            setAuthModal({ open: false, mode: 'login' });
          } else {
            setAuthError(data.detail || 'فشل تسجيل الدخول / Login failed');
          }
        } catch (err) {
          setAuthError('حدث خطأ في الاتصال بالخادم / Server connection error');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        setAuthLoading(true);
        setAuthError('');
        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(registerForm)
          });
          const data = await res.json();
          if (res.ok) {
            localStorage.setItem('esla_token', data.access_token);
            setToken(data.access_token);
            setUser(data.user);
            setAuthModal({ open: false, mode: 'login' });
          } else {
            setAuthError(data.detail || 'فشل إنشاء الحساب / Registration failed');
          }
        } catch (err) {
          setAuthError('حدث خطأ في الاتصال / Server error');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('esla_token');
        setToken(null);
        setUser(null);
        setApplication(null);
        setActiveTab('status');
      };

      // Quick demo switcher handler
      const quickLogin = (email, pass) => {
        setLoginEmail(email);
        setLoginPassword(pass);
        setAuthModal({ open: true, mode: 'login' });
      };

      // Tier Selection
      const selectTier = async (tierId) => {
        if (!token) {
          setAuthModal({ open: true, mode: 'login' });
          return;
        }
        try {
          const res = await fetch('/api/applications/', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ category: tierId })
          });
          if (res.ok) {
            const data = await res.json();
            setApplication(data);
            setActiveTab('upload');
          } else {
            const err = await res.json();
            alert(err.detail);
          }
        } catch (e) {
          console.error(e);
        }
      };

      // File upload handler
      const handleFileUpload = async (docType, file) => {
        if (!file) return;

        // Client-side validation: Max 15MB
        if (file.size > 15 * 1024 * 1024) {
          setUploadError(lang === 'ar' ? 'حجم الملف يتجاوز 15 ميجابايت' : 'File exceeds 15MB limit');
          return;
        }

        const allowedExtensions = ['.pdf', '.jpg', '.jpeg', '.png'];
        const ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
        if (!allowedExtensions.includes(ext)) {
          setUploadError(lang === 'ar' ? 'صيغة الملف غير مدعومة (فقط PDF, JPG, PNG)' : 'File format not supported (PDF, JPG, PNG only)');
          return;
        }

        setUploadError('');
        setUploadingDocType(docType);

        const formData = new FormData();
        formData.append('doc_type', docType);
        formData.append('file', file);

        try {
          const res = await fetch('/api/documents/upload', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`
            },
            body: formData
          });
          if (res.ok) {
            await fetchMyApplication();
          } else {
            const err = await res.json();
            setUploadError(err.detail);
          }
        } catch (e) {
          setUploadError('فشل رفع المستند / Upload failed');
        } finally {
          setUploadingDocType(null);
        }
      };

      // Submit application for final verification
      const submitForVerification = async () => {
        try {
          const res = await fetch('/api/applications/my/submit-for-review', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            setApplication(data);
            setActiveTab('status');
            alert(curT.submitSuccessMsg);
          } else {
            const err = await res.json();
            alert(err.detail);
          }
        } catch (e) {
          console.error(e);
        }
      };

      // Admin Decision Submission
      const handleAdminSubmitDecision = async () => {
        if (!selectedApp || !adminDecision.status) return;
        try {
          const res = await fetch(`/api/admin/applications/${selectedApp.id}/status`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              status: adminDecision.status,
              admin_notes: adminDecision.notes
            })
          });
          if (res.ok) {
            await fetchAdminData();
            setSelectedApp(null);
            alert(lang === 'ar' ? 'تم تحديث حالة الطلب بنجاح' : 'Application status updated successfully');
          } else {
            const err = await res.json();
            alert(err.detail);
          }
        } catch (e) {
          console.error(e);
        }
      };

      // Status badge styling helper
      const getStatusBadge = (status) => {
        switch (status) {
          case 'approved':
            return <span className="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-300">✓ {curT.tierApproved}</span>;
          case 'needs_action':
            return <span className="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-300">⚠ {curT.tierNeedsAction}</span>;
          case 'under_verification':
            return <span className="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-800 border border-blue-300">⏳ {curT.tierUnderReview}</span>;
          case 'rejected':
            return <span className="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-100 text-rose-800 border border-rose-300">✕ {curT.tierRejected}</span>;
          default:
            return <span className="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 border border-slate-300">⏱ {curT.tierPending}</span>;
        }
      };

      // Current active tier object for member
      const activeTierObj = useMemo(() => {
        if (!application || !tiers.length) return null;
        return tiers.find(t => t.id === application.category);
      }, [application, tiers]);

      return (
        <div className="flex flex-col min-h-screen">
          {/* Top Quick Demo Bar */}
          <div className="bg-emerald-900 text-emerald-100 text-xs py-1.5 px-4 flex flex-wrap items-center justify-between border-b border-emerald-800">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="font-bold text-amber-400">⚡ {curT.quickDemo}</span>
              <button onClick={() => quickLogin('admin@esla.org.eg', 'Admin@ESLA2026')} className="bg-emerald-800 hover:bg-emerald-700 px-2 py-0.5 rounded text-emerald-100 transition">
                {curT.demoAdmin}
              </button>

                          <h3 className="text-lg font-black text-slate-900">
                            {lang === 'ar' ? (activeTierObj ? activeTierObj.title_ar : application.category) : application.category}
                          </h3>
                        </div>

                        <button
                          onClick={() => setActiveTab('upload')}
                          className="px-4 py-2 bg-emerald-800 hover:bg-emerald-900 text-white text-xs font-bold rounded-xl transition shadow-sm"
                        >
                          📂 {lang === 'ar' ? 'عرض / تعديل المستندات المرفوعة' : 'Manage Uploaded Documents'}
                        </button>
                      </div>

                      {/* Prominent Admin Notes Box if exists */}
                      {application.admin_notes && (
                        <div className="mt-4 pt-4 border-t border-slate-200/80">
                          <div className="text-xs font-bold text-slate-700 mb-1 flex items-center gap-1.5">
                            <span>📝</span>
                            <span>{curT.adminNotesAlert}</span>
                          </div>
                          <div className="p-3 bg-white rounded-xl border border-slate-200 text-xs md:text-sm text-slate-800 leading-relaxed font-medium">
                            {application.admin_notes}
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB 4: ADMIN DASHBOARD */}
            {activeTab === 'admin' && user && user.role === 'admin' && (
              <div className="space-y-6">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-2xl font-extrabold text-slate-900">
                      {curT.adminOverview}
                    </h2>
                    <p className="text-xs text-slate-500 mt-0.5">
                      لجنة القيد واعتماد العضويات المهنية - الجمعية المصرية لمعماريي تنسيق الموقع
                    </p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={fetchAdminData}
                      className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition border border-slate-300"
                    >
                      🔄 تحديث البيانات
                    </button>
                  </div>
                </div>

                {/* Metrics Stats Cards */}
                {adminStats && (
                  <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                    <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                      <span className="text-xs font-semibold text-slate-500">{curT.statsTotal}</span>
                      <div className="text-2xl font-black text-slate-900 mt-1">{adminStats.total_applications}</div>
                    </div>
                    <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                      <span className="text-xs font-semibold text-blue-600">{curT.statsUnderVerification}</span>
                      <div className="text-2xl font-black text-blue-700 mt-1">{adminStats.under_verification}</div>
                    </div>
                    <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                      <span className="text-xs font-semibold text-emerald-600">{curT.statsApproved}</span>
                      <div className="text-2xl font-black text-emerald-700 mt-1">{adminStats.approved}</div>
                    </div>
                    <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                      <span className="text-xs font-semibold text-amber-600">{curT.statsNeedsAction}</span>
                      <div className="text-2xl font-black text-amber-700 mt-1">{adminStats.needs_action}</div>
                    </div>
                    <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                      <span className="text-xs font-semibold text-slate-500">{curT.statsPending}</span>
                      <div className="text-2xl font-black text-slate-700 mt-1">{adminStats.pending_review}</div>
                    </div>
                  </div>
                )}

                {/* Filters & Search Bar */}
                <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
                  <div className="w-full md:w-96">
                    <input
                      type="text"
                      placeholder={curT.searchPlaceholder}
                      value={adminSearch}
                      onChange={(e) => setAdminSearch(e.target.value)}
                      className="w-full px-4 py-2 text-xs border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-600"
                    />
                  </div>

                  <div className="flex items-center gap-3 w-full md:w-auto">
                    <select
                      value={adminCategoryFilter}
                      onChange={(e) => setAdminCategoryFilter(e.target.value)}
                      className="px-3 py-2 text-xs border border-slate-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600"
                    >
                      <option value="all">{curT.filterAll}</option>
                      <option value="student">عضو طالب (Student)</option>
                      <option value="graduate">عضو منتسب (Graduate)</option>
                      <option value="professional">عضو عامل (Professional)</option>
                      <option value="consultant">عضو استشاري (Consultant)</option>
                    </select>

                    <select
                      value={adminStatusFilter}
                      onChange={(e) => setAdminStatusFilter(e.target.value)}
                      className="px-3 py-2 text-xs border border-slate-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600"
                    >
                      <option value="all">{curT.filterStatusAll}</option>
                      <option value="pending_review">قيد المراجعة</option>
                      <option value="under_verification">قيد التدقيق الفني</option>
                      <option value="needs_action">مطلوب إجراء</option>
                      <option value="approved">معتمد</option>
                      <option value="rejected">مرفوض</option>
                    </select>
                  </div>
                </div>

                {/* Applicants Table */}
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                  <div className="overflow-x-auto">
                    <table className="w-full text-right text-xs">
                      <thead className="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                        <tr>
                          <th className="py-3.5 px-4">{curT.colApplicant}</th>
                          <th className="py-3.5 px-4">{curT.colTier}</th>
                          <th className="py-3.5 px-4">المستندات المرفقة</th>
                          <th className="py-3.5 px-4">{curT.colStatus}</th>
                          <th className="py-3.5 px-4 text-center">{curT.colActions}</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {adminApps.length === 0 ? (
                          <tr>
                            <td colSpan="5" className="py-8 text-center text-slate-500 font-medium">
                              لا توجد طلبات مطابقة لمعايير البحث
                            </td>
                          </tr>
                        ) : (
                          adminApps.map((app) => (
                            <tr key={app.id} className="hover:bg-slate-50/70 transition">
                              <td className="py-3.5 px-4">
                                <div className="font-bold text-slate-900 text-sm">{app.user?.full_name_ar}</div>
                                <div className="text-slate-500 text-[11px]">{app.user?.email}</div>
                                <div className="text-emerald-700 text-[11px] font-semibold mt-0.5 flex items-center gap-1">
                                  <span>📱 {app.user?.phone_whatsapp}</span>
                                </div>
                              </td>
                              <td className="py-3.5 px-4">
                                <span className="inline-block font-bold text-emerald-900 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200">
                                  {app.category}
                                </span>
                              </td>
                              <td className="py-3.5 px-4">
                                <span className="font-semibold text-slate-700">
                                  📁 {app.documents.length} ملفات مرفوعة
                                </span>
                              </td>
                              <td className="py-3.5 px-4">
                                {getStatusBadge(app.status)}
                              </td>
                              <td className="py-3.5 px-4 text-center">
                                <button
                                  onClick={() => {
                                    setSelectedApp(app);
                                    setAdminDecision({
                                      status: app.status,
                                      notes: app.admin_notes || ''
                                    });
                                  }}
                                  className="px-3.5 py-1.5 bg-emerald-800 hover:bg-emerald-900 text-white rounded-lg font-bold text-xs shadow-sm transition"
                                >
                                  🔍 {curT.reviewApplicantBtn}
                                </button>
                              </td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* APPLICANT REVIEW MODAL (FOR ADMIN) */}
          {selectedApp && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-3xl w-full border border-slate-200 shadow-2xl overflow-hidden my-8">
                {/* Modal Header */}
                <div className="bg-emerald-900 text-white p-6 flex items-center justify-between">
                  <div>
                    <span className="text-xs text-emerald-300 font-bold">ملف تدقيق العضوية رقم #{selectedApp.id}</span>
                    <h3 className="text-xl font-extrabold mt-1">
                      {selectedApp.user?.full_name_ar}
                    </h3>
                    <p className="text-xs text-emerald-200 font-medium">{selectedApp.user?.full_name_en}</p>
                  </div>
                  <button
                    onClick={() => setSelectedApp(null)}
                    className="w-9 h-9 rounded-full bg-emerald-800 hover:bg-emerald-700 flex items-center justify-center text-white font-bold transition"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-6 space-y-6 max-h-[75vh] overflow-y-auto">
                  {/* Personal info & WhatsApp shortcut */}
                  <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                    <div>
                      <span className="text-slate-500 font-semibold">الفئة المقدم عليها:</span>
                      <div className="text-sm font-bold text-slate-900">{selectedApp.category}</div>
                    </div>
                    <div>
                      <span className="text-slate-500 font-semibold">البريد الإلكتروني:</span>
                      <div className="text-sm font-bold text-slate-900">{selectedApp.user?.email}</div>
                    </div>
                    <div>
                      <span className="text-slate-500 font-semibold">الهاتف / واتساب:</span>
                      <div className="mt-0.5">
                        <a
                          href={`https://wa.me/${selectedApp.user?.phone_whatsapp?.replace(/[^0-9]/g, '')}`}
                          target="_blank"
                          rel="noreferrer"
                          className="inline-flex items-center gap-1 font-bold text-emerald-700 hover:underline"
                        >
                          🟢 {selectedApp.user?.phone_whatsapp}
                        </a>
                      </div>
                    </div>
                  </div>

                  {/* Submitted Documents Inspection */}
                  <div>
                    <h4 className="text-sm font-bold text-slate-900 mb-3 flex items-center gap-2">
                      <span>📄</span> {curT.submittedDocs} ({selectedApp.documents.length})
                    </h4>

                    {selectedApp.documents.length === 0 ? (
                      <p className="text-xs text-slate-500 italic bg-slate-50 p-4 rounded-xl">
                        {curT.noDocsUploaded}
                      </p>
                    ) : (
                      <div className="space-y-2">
                        {selectedApp.documents.map((doc) => (
                          <div
                            key={doc.id}
                            className="bg-white p-3.5 rounded-xl border border-slate-200 flex items-center justify-between gap-4 hover:border-emerald-300 transition"
                          >
                            <div className="flex items-center gap-3">
                              <span className="text-2xl">
                                {doc.mime_type?.includes('pdf') ? '📕' : '🖼️'}
                              </span>
                              <div>
                                <div className="text-xs font-bold text-slate-900">
                                  {doc.doc_type} ({doc.original_filename})
                                </div>
                                <div className="text-[10px] text-slate-500">
                                  {(doc.file_size / 1024).toFixed(1)} KB • {doc.status}
                                </div>
                              </div>
                            </div>

                            <div className="flex items-center gap-2">
                              <button
                                onClick={() => setPreviewModalUrl(doc.preview_url)}
                                className="text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg border border-slate-300 transition"
                              >
                                👁️ {curT.previewDoc}
                              </button>
                              <a
                                href={`/api/documents/${doc.id}/download`}
                                download
                                className="text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg border border-slate-300 transition"
                              >
                                ⬇️ {curT.downloadDoc}
                              </a>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Committee Decision Panel */}
                  <div className="bg-emerald-50/50 p-5 rounded-2xl border border-emerald-200 space-y-4">
                    <h4 className="text-sm font-bold text-emerald-950 flex items-center gap-2">
                      <span>⚖️</span> {curT.decisionTitle}
                    </h4>

                    {/* Decision Radios */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                      <button
                        type="button"
                        onClick={() => setAdminDecision({ ...adminDecision, status: 'approved' })}
                        className={`p-3 rounded-xl border text-xs font-extrabold transition flex items-center justify-center gap-1.5 ${
                          adminDecision.status === 'approved'
                            ? 'bg-emerald-700 text-white border-emerald-800 shadow-sm'
                            : 'bg-white text-emerald-800 border-slate-200 hover:bg-emerald-50'
                        }`}
                      >
                        ✓ {curT.decisionApprove}
                      </button>

                      <button
                        type="button"
                        onClick={() => setAdminDecision({ ...adminDecision, status: 'needs_action' })}
                        className={`p-3 rounded-xl border text-xs font-extrabold transition flex items-center justify-center gap-1.5 ${
                          adminDecision.status === 'needs_action'
                            ? 'bg-amber-600 text-white border-amber-700 shadow-sm'
                            : 'bg-white text-amber-800 border-slate-200 hover:bg-amber-50'
                        }`}
                      >
                        ⚠ {curT.decisionNeedsAction}
                      </button>

                      <button
                        type="button"
                        onClick={() => setAdminDecision({ ...adminDecision, status: 'rejected' })}
                        className={`p-3 rounded-xl border text-xs font-extrabold transition flex items-center justify-center gap-1.5 ${
                          adminDecision.status === 'rejected'
                            ? 'bg-rose-700 text-white border-rose-800 shadow-sm'
                            : 'bg-white text-rose-800 border-slate-200 hover:bg-rose-50'
                        }`}
                      >
                        ✕ {curT.decisionReject}
                      </button>
                    </div>

                    {/* Notes Textarea */}
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1.5">
                        ملاحظات وتوجيهات اللجنة للمتقدم:
                      </label>
                      <textarea
                        rows="3"
                        placeholder={curT.notesPlaceholder}
                        value={adminDecision.notes}
                        onChange={(e) => setAdminDecision({ ...adminDecision, notes: e.target.value })}
                        className="w-full text-xs p-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-700"
                      ></textarea>
                    </div>

                    <button
                      type="button"
                      onClick={handleAdminSubmitDecision}
                      className="w-full py-3 bg-emerald-800 hover:bg-emerald-900 text-white rounded-xl font-extrabold text-xs shadow-md transition"
                    >
                      💾 {curT.saveDecision}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* DOCUMENT PREVIEW MODAL */}
          {previewModalUrl && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-4xl w-full h-[85vh] flex flex-col overflow-hidden shadow-2xl">
                <div className="p-3 bg-slate-900 text-white flex items-center justify-between text-xs font-bold">
                  <span>معاينة المستند الرسمي</span>
                  <button
                    onClick={() => setPreviewModalUrl(null)}
                    className="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded-full flex items-center justify-center text-white"
                  >
                    ✕
                  </button>
                </div>
                <div className="flex-1 bg-slate-100 p-2 overflow-hidden">
                  <iframe
                    src={previewModalUrl}
                    className="w-full h-full rounded border-0"
                    title="Document Preview"
                  />
                </div>
              </div>
            </div>
          )}

          {/* AUTH MODAL (LOGIN / REGISTER) */}
          {authModal.open && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full border border-slate-200 shadow-2xl p-6 relative">
                <button
                  onClick={() => setAuthModal({ open: false, mode: 'login' })}
                  className="absolute top-5 left-5 w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center text-sm font-bold transition"
                >
                  ✕
                </button>

                <div className="text-center space-y-1 mb-6">
                  <span className="text-3xl">🌿</span>
                  <h3 className="text-xl font-extrabold text-slate-900">
                    {authModal.mode === 'login' ? curT.login : curT.register}
                  </h3>
                  <p className="text-xs text-slate-500">
                    {curT.societyName}
                  </p>
                </div>

                {authError && (
                  <div className="p-3 mb-4 bg-rose-50 border border-rose-200 rounded-xl text-xs font-bold text-rose-700">
                    ⚠️ {authError}
                  </div>
                )}

                {authModal.mode === 'login' ? (
                  <form onSubmit={handleLogin} className="space-y-4 text-xs">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{curT.email}</label>
                      <input
                        type="email"
                        required
                        value={loginEmail}
                        onChange={(e) => setLoginEmail(e.target.value)}
                        className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-700"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{curT.password}</label>
                      <input
                        type="password"
                        required
                        value={loginPassword}
                        onChange={(e) => setLoginPassword(e.target.value)}
                        className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-700"
                      />
                    </div>
                    <button
                      type="submit"
                      disabled={authLoading}
                      className="w-full py-3 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl font-extrabold shadow-md transition"
                    >
                      {authLoading ? 'جاري التحقق...' : curT.login}
                    </button>
                    <div className="text-center pt-2">
                      <button
                        type="button"
                        onClick={() => setAuthModal({ open: true, mode: 'register' })}
                        className="text-emerald-700 hover:underline font-bold"
                      >
                        {curT.noAccount}
                      </button>
                    </div>
                  </form>
                ) : (
                  <form onSubmit={handleRegister} className="space-y-3 text-xs">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{curT.fullNameAr}</label>
                      <input
                        type="text"
                        required
                        placeholder="مثال: م. أحمد محمد إبراهيم"
                        value={registerForm.full_name_ar}
                        onChange={(e) => setRegisterForm({ ...registerForm, full_name_ar: e.target.value })}
                        className="w-full px-3.5 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-700"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{curT.fullNameEn}</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. Eng. Ahmed Mohamed Ibrahim"
                        value={registerForm.full_name_en}
                        onChange={(e) => setRegisterForm({ ...registerForm, full_name_en: e.target.value })}
                        className="w-full px-3.5 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-700"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{curT.phoneWhatsapp}</label>
                      <input
                        type="tel"
                        required
                        placeholder="+2010..."
                        value={registerForm.phone_whatsapp}
                        onChange={(e) => setRegisterForm({ ...registerForm, phone_whatsapp: e.target.value })}
                        className="w-full px-3.5 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-700"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{curT.email}</label>
                      <input
                        type="email"
                        required
                        value={registerForm.email}
                        onChange={(e) => setRegisterForm({ ...registerForm, email: e.target.value })}
                        className="w-full px-3.5 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-700"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">{curT.password}</label>
                      <input
                        type="password"
                        required
                        minLength="6"
                        value={registerForm.password}
                        onChange={(e) => setRegisterForm({ ...registerForm, password: e.target.value })}
                        className="w-full px-3.5 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-700"
                      />
                    </div>
                    <button
                      type="submit"
                      disabled={authLoading}
                      className="w-full py-3 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl font-extrabold shadow-md transition mt-2"
                    >
                      {authLoading ? 'جاري التسجيل...' : curT.register}
                    </button>
                    <div className="text-center pt-2">
                      <button
                        type="button"
                        onClick={() => setAuthModal({ open: true, mode: 'login' })}
                        className="text-emerald-700 hover:underline font-bold"
                      >
                        {curT.alreadyHaveAccount}
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-8 border-t border-slate-800 mt-auto">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4 text-center md:text-right">
              <div>
                <p className="font-bold text-slate-200">
                  © 2026 {curT.societyName} (ESLA) - جميع الحقوق محفوظة
                </p>
                <p className="text-[11px] text-slate-500 mt-0.5">
                  بوابة القيد واعتماد المهندسين واستشاريي عمارة البيئة وتنسيق الموقع بجمهورية مصر العربية
                </p>
              </div>
              <div className="flex items-center gap-4 text-[11px] text-slate-400">
                <span>معايير IFLA الدولية</span>
                <span>•</span>
                <span>نقابة المهندسين المصرية</span>
                <span>•</span>
                <span>قانون حماية البيانات</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
